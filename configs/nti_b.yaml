model:
  vocab_size: 1024
  codebook_dim: 256
  sequence_length: 256
  num_classes: 1000
  hidden_size: 768
  depth: 24
  num_heads: 16
  mlp_size: 3072
  dropout: 0.1
  attention_dropout: 0.1
  class_dropout: 0.1
  qk_norm: true
  layer_norm_eps: 1.0e-06
training:
  arm: nti
  target_mode: tv_history_conditioned
  history_source: lagged_replay
  replay_bank_root: replay/nti_b
  replay_start_step: 10000
  replay_refresh_steps: 10000
  replay_end_step: 200000
  replay_top_k: 64
  replay_target_encoding: categorical_mc
  replay_stream_mode: mixed
  alpha: 0.0
  codebook_kernel_temperature: 0.05
  history_temperature: 1.0
  history_top_k: 0
  history_top_p: 1.0
  replacement_max_ratio: 0.3
  replacement_ratio_sampling: per_image_uniform
  replacement_start_fraction: 0.0
  replacement_warmup_fraction: 0.25
  replacement_decay_start_fraction: 0.25
  replacement_end_fraction: 0.8
  replacement_schedule: bell_cosine
  branch_active_only_when_replacement_positive: true
  auxiliary_loss_gate: normalized_replacement
  clean_loss_weight: 1.0
  branch_loss_weight: 0.5
  branch_image_fraction: 1.0
  branch_loss_scope: active_prefix
  epochs: 405
  max_steps: 250000
  global_batch_size: 2048
  per_device_batch_size: 128
  learning_rate: 0.0004
  end_learning_rate: 1.0e-05
  warmup_steps: 62500
  beta1: 0.9
  beta2: 0.96
  weight_decay: 0.03
  max_grad_norm: 1.0
  precision: bf16
  seed: 42
  num_workers: 8
  log_every: 50
  save_every: 5000
  checkpoint_milestone_every: 10000
  checkpoint_keep_last: 3
monitoring:
  preview_every: 5000
  preview_seed: 42
  preview_class_ids:
  - 1
  - 7
  - 282
  - 604
  - 724
  - 179
  - 751
  - 404
  - 850
  - 954
  preview_rows: 2
  preview_temperature: 1.0
  preview_top_k: 0
  preview_top_p: 1.0
  preview_guidance_scale: 15.0
  preview_guidance_scale_pow: 2.5
  preview_decode_batch_size: 1
  grad_norm_every: 1000
data:
  train_manifest: data/tokens/nti_manifest.json
  validation_manifest: data/tokens/nti_manifest.json
  tokenizer_checkpoint: assets/tokenizer.bin
  rear_source_root: external/reAR
  image_root: data/imagenet
run:
  name: nti_b
  output_dir: outputs
  resume: ''
  compile_model: true
  deterministic: false
